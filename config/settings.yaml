# Paramètres réglables du POC (CLAUDE.md §12 : rien en dur dans le code).

chemins:
  corpus: data/corpus
  reference: data/reference/reference.csv   # export interne numéro → nom, adresse
  verite_terrain: data/ground_truth.csv
  # Déclaratif extranet (bloc B) : CSV sans en-tête, 1 ligne par PDF déposé (motif glob)
  declaratif: data/corpus/AttestationAssurances*.csv
  sortie: data/output

reference:
  # Export entrepôt [BDDH].[US_ENT].[TH_LOCATAIRE] (data/reference/extraction_reference.sql) :
  # une ligne par occupant et par lot ; seuls les occupants du lot du dépôt, non sortis, sont retenus.
  separateur: ";"
  valeur_nulle: "NULL"

numero_locataire:
  # Nom de fichier : « <numero>_... » (chiffres avant le 1er underscore), ex. 1234_xxx.pdf
  # Dans l'entrepôt Elogie, le numéro tient sur 11 caractères, complété par des zéros à gauche :
  # 1234 → 00000001234. Format à appliquer pour la jointure avec data/reference.
  longueur_entrepot: 11
  caractere_remplissage: "0"

ollama:
  url: http://localhost:11434               # local uniquement (RGPD §4)
  modele: qwen2.5:7b-instruct                # alternative : llama3.1:8b
  temperature: 0
  timeout_secondes: 300
  num_ctx: 8192            # taille de contexte (prompt + document) ; 2048 par défaut tronquerait
  nb_essais: 3             # réessais si la réponse n'est pas un JSON valide
  keep_alive: 10m          # garde le modèle en mémoire entre deux documents (évite de le recharger)

extraction:
  max_caracteres_texte: 12000   # texte envoyé au modèle (au-delà : tronqué, signalé dans le journal)
  langue_dates: fr
  # Anti-hallucination : une valeur dite « trouvée » doit se retrouver dans le texte du document
  # (comparaison floue, 0-100). Sinon → statut « ambigu ».
  seuil_presence_dans_texte: 90
  # Mention de garantie (formulations de config/mentions.yaml), comparaison floue 0-100 pour tolérer l'OCR :
  mention:
    seuil_presente: 90          # >= → presente
    seuil_indeterminee: 80      # entre les deux → indeterminee ; en dessous → absente

ocr:
  langue: fra
  tesseract_cmd: null     # chemin de tesseract.exe si absent du PATH
  dpi: 300
  # Si l'extraction directe renvoie moins de N caractères utiles par page → bascule OCR
  min_caracteres_par_page: 50

exploitabilite:
  # Part minimale de « vrais mots » dans le texte pour le juger exploitable (anti-charabia)
  ratio_mots_valides_min: 0.5
  min_caracteres_total: 100
  # Confiance OCR moyenne minimale (0-100, Tesseract) pour un document lu (au moins en partie) par OCR.
  # Critère distinct du score de mots : un scan peut produire des mots plausibles mais faux.
  # Sous ce seuil → non_exploitable → douteux (prudence : mieux vaut un faux négatif qu'un faux positif).
  # Valeur de départ 55, À AJUSTER avec la vérité terrain (comparer confiance OCR et justesse des champs).
  confiance_ocr_min: 55

correspondance:
  # Seuils rapidfuzz (0-100), réglés de façon exigeante (arbitrage §6 : pas de faux positif)
  nom:
    seuil_net: 95        # >= → correspondance nette (95 : « DUPOND » ≠ « DUPONT » sur un nom court, score 91)
    seuil_douteux: 70    # entre douteux et net → douteux ; en dessous → contradiction
    # Mots retirés avant comparaison (civilités, liaisons)
    mots_ignores: [m, mr, mme, mlle, monsieur, madame, mademoiselle, et]
    # Mots d'alliance (« Marie MARTIN épouse DUPONT », « Marie DUPONT née MARTIN ») : le nom est découpé
    # en variantes (nom avant le mot, et nom avant le mot dont un mot est remplacé par la suite) ; la meilleure compte.
    mots_alliance: [epouse, ep, nee, ne, veuve, vve, divorcee, epoux]
  adresse:
    seuil_net: 85        # score sur le nom de voie + ville ; numéro de rue et code postal : égalité stricte
    seuil_douteux: 65
    # Abréviations développées avant comparaison
    abreviations: {bd: boulevard, bld: boulevard, av: avenue, ave: avenue, r: rue, pl: place,
                   imp: impasse, all: allee, sq: square, fg: faubourg, fbg: faubourg, pas: passage,
                   qu: quai, rte: route, ch: chemin, st: saint, ste: sainte}
    # Compléments d'adresse retirés avec le mot qui suit (bât. B, esc. 2, appt 34…)
    complements: [bat, batiment, esc, escalier, appt, apt, appartement, etage, eta, porte, bal, lot, logement, residence]
  declaratif:
    seuil_net: 90        # assureur (après table d'alias config/assureurs.yaml)
    # N° de police : égalité après normalisation, ou l'un contenu dans l'autre (préfixes saisis par le locataire)
    police_longueur_min_inclusion: 6
    ecart_dates_jours_douteux: 0     # tout écart de date → au moins douteux
    # Au-delà : non_conforme, pour la date de FIN seulement. La date de début saisie est souvent
    # la date du dépôt ou de souscription d'origine (observé sur le corpus du 14/10) → plafonnée à douteux.
    ecart_dates_jours_non_conforme: 31

validite:
  # PAV-3 : date à laquelle l'attestation doit être valable.
  #   depot = date de dépôt lue dans le nom de fichier (rejouable à l'identique ; défaut retenu)
  #   jour  = date du traitement ;  ou une date ISO AAAA-MM-JJ fixe.
  date_reference: depot
  # Verdicts des cas limites (valeurs par défaut, à revalider avec le métier) :
  date_fin_absente: douteux        # validité non prouvable, sans être une absence avérée
  date_debut_future: douteux       # attestation de l'année suivante déposée en avance

mention:
  # Mention non trouvée sur un document lu (au moins en partie) par OCR : l'OCR a pu manquer la ligne
  absente_si_ocr: douteux
  absente_si_texte: non_conforme
